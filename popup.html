<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Memória das Abas</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topo">
    <div class="linha">
      <div>
        <h1>Memória das Abas</h1>
        <p id="ram" class="sub">medindo…</p>
      </div>
      <div class="acoes">
        <button id="atualizar" title="Medir agora" aria-label="Medir agora">↻</button>
        <button id="opcoes" title="Configurações e histórico" aria-label="Configurações e histórico">⚙</button>
      </div>
    </div>
    <div id="barra" class="barra" role="progressbar" aria-label="RAM usada" aria-valuemin="0" aria-valuemax="100"><span></span></div>
    <p id="resumo" class="resumo"></p>
    <div class="ferramentas">
      <input id="busca" type="search" placeholder="Buscar aba ou site…" aria-label="Buscar aba ou site" autocomplete="off">
      <select id="ordem" aria-label="Ordenar por">
        <option value="mem">Mais memória</option>
        <option value="cpu">Mais CPU</option>
        <option value="parada">Parada há mais tempo</option>
      </select>
    </div>
    <div class="filtros">
      <div id="filtros" role="radiogroup" aria-label="Filtrar abas"></div>
      <label class="agrupar"><input type="checkbox" id="agrupar"> por site</label>
    </div>
  </header>

  <ol id="abas"></ol>

  <div class="rodape-lista">
    <button id="mais" hidden></button>
    <button id="suspenderLista" hidden title="Abas ativas, tocando som ou protegidas ficam de fora"></button>
  </div>

  <p class="nota" title="Memória do JavaScript + elementos + frames de terceiros. Para números reais por processo, use o gerenciador de tarefas do navegador: Shift+Esc no Windows/Linux, menu Janela no macOS, about:processes no Firefox.">
    Valores são <b>estimativas</b> ⓘ — números reais: gerenciador de tarefas do navegador.
  </p>
  <script src="config.js"></script>
  <script src="comum.js"></script>
  <script src="popup.js"></script>
</body>
</html>
